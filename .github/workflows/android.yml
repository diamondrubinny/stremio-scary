# SCARY Web as an Android app: the web app packed into an APK (android/). Builds the feed and the web app, then the
# APK, on every push; lints it; and keeps the APK as a build artifact. No secrets are needed: without a signing key the
# APK is signed with the runner's debug key. With the SCARY_KEYSTORE_* secrets it is signed with that key, so each
# build installs over the one before.
name: Android

on:
  push:
    branches:
      - master
      - "claude/**"
    paths:
      - "android/**"
      - "web/**"
      - "feed/**"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.8.0
          run_install: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build SCARY's catalogs
        working-directory: feed
        run: npm run build
      - name: Build the web app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: The signing key, when the repository has one
        env:
          KEYSTORE_BASE64: ${{ secrets.SCARY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/scary.keystore"
            echo "SCARY_KEYSTORE_FILE=$RUNNER_TEMP/scary.keystore" >> "$GITHUB_ENV"
          else
            echo "No signing key: the APK is signed with this runner's debug key."
          fi
      - name: Lint and build the APK
        working-directory: android
        env:
          SCARY_KEYSTORE_PASSWORD: ${{ secrets.SCARY_KEYSTORE_PASSWORD }}
          SCARY_KEY_ALIAS: ${{ secrets.SCARY_KEY_ALIAS }}
          SCARY_KEY_PASSWORD: ${{ secrets.SCARY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleRelease
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: scary-web-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
